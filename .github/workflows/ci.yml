name: CI & Deploy

on:
  push:
    branches:
      - main
      - codex/hermes-learning-checkpoint-20260707
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      quote_rule_version:
        description: Published quote rule version
        required: true
        type: string
      quote_data_version:
        description: Published quote data version
        required: true
        type: string
      quote_published_at:
        description: UTC ISO-8601 publication timestamp
        required: true
        type: string
      quote_valid_from:
        description: First effective date (YYYY-MM-DD)
        required: true
        type: string
      quote_valid_to:
        description: Last effective date (YYYY-MM-DD)
        required: true
        type: string
      quote_test_data:
        description: Explicit test-data declaration
        required: true
        default: "false"
        type: choice
        options: ["false"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: canada_quote_test
          POSTGRES_USER: quote_app
          POSTGRES_PASSWORD: quote_app_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quote_app -d canada_quote_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Verify Postgres migrations
        env:
          DATABASE_URL: postgresql+psycopg://quote_app:quote_app_test_password@localhost:5432/canada_quote_test
        run: alembic upgrade head

      - name: Run pytest
        env:
          DEV_AUTH_DISABLED: "true"
        run: pytest -q

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build web
        working-directory: apps/web
        run: npm run build

      - name: Audit web dependencies
        working-directory: apps/web
        run: npm audit --audit-level=moderate
        continue-on-error: true

  deploy:
    name: Deploy production
    needs: test
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://quote.freightclaw.net
    concurrency:
      group: production-deploy
      # A newer push waits for the active deployment instead of interrupting
      # rsync or Docker Compose halfway through an update.
      cancel-in-progress: false
    env:
      DEPLOY_PATH: /home/opc/canada-final-mile-auto-quote
      COMPOSE_PROJECT: canada_quote_oracle
      COMPOSE_FILE: infra/docker-compose.prod.yml
      ENV_FILE: .env.prod
      API_PORT: 18000
      DEPLOY_SHA: ${{ github.sha }}
      QUOTE_RULE_VERSION: ${{ inputs.quote_rule_version || '' }}
      QUOTE_DATA_VERSION: ${{ inputs.quote_data_version || '' }}
      QUOTE_PUBLISHED_AT: ${{ inputs.quote_published_at || '' }}
      QUOTE_VALID_FROM: ${{ inputs.quote_valid_from || '' }}
      QUOTE_VALID_TO: ${{ inputs.quote_valid_to || '' }}
      QUOTE_TEST_DATA: ${{ inputs.quote_test_data || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python for release validation
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install release validation package
        run: python -m pip install -e .

      - name: Require controlled quote release inputs
        run: |
          set -euo pipefail
          test "$QUOTE_TEST_DATA" = "false"
          python scripts/publish_quote_release.py \
            --validate-only \
            --release-id "$DEPLOY_SHA" \
            --service-version "$(python -c 'from importlib import metadata; print(metadata.version("canada-final-mile-auto-quote"))')" \
            --rule-version "$QUOTE_RULE_VERSION" \
            --data-version "$QUOTE_DATA_VERSION" \
            --published-at "$QUOTE_PUBLISHED_AT" \
            --valid-from "$QUOTE_VALID_FROM" \
            --valid-to "$QUOTE_VALID_TO" \
            --test-data "$QUOTE_TEST_DATA" \
            --deployment-sha "$DEPLOY_SHA" \
            --deployment-ref "$GITHUB_REF"

      - name: Configure production SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_JUMP_SSH_KEY: ${{ secrets.DEPLOY_JUMP_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$DEPLOY_SSH_KEY" || -z "$DEPLOY_JUMP_SSH_KEY" ]]; then
            echo "::error::Production deployment secrets are not configured."
            exit 1
          fi
          install -m 700 -d "$HOME/.ssh"
          umask 077
          printf '%s\n' "$DEPLOY_JUMP_SSH_KEY" > "$HOME/.ssh/deploy_jump_key"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_target_key"
          cat > "$HOME/.ssh/config" <<'EOF'
          Host deploy_jump
            HostName 43.167.222.170
            User ubuntu
            IdentityFile ~/.ssh/deploy_jump_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ServerAliveInterval 30
            ServerAliveCountMax 3

          Host production
            HostName 150.230.208.231
            User opc
            IdentityFile ~/.ssh/deploy_target_key
            IdentitiesOnly yes
            ProxyJump deploy_jump
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ServerAliveInterval 30
            ServerAliveCountMax 3
          EOF
          cat > "$HOME/.ssh/known_hosts" <<'EOF'
          43.167.222.170 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAikuCtZ6d6fx7PpzxFQutlatbKnUvHYgA/6FzhdPPrq
          150.230.208.231 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINMlndhKdfHK+bn1WLv1325iqD45GEa1OWkNySHNqmpr
          EOF
          chmod 600 "$HOME/.ssh/config" "$HOME/.ssh/known_hosts"
          ssh -o BatchMode=yes production 'printf "production ssh: ok\\n"'

      - name: Sync source to production
        run: |
          set -euo pipefail
          rsync -az --delete-delay --delay-updates \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.deploy-state/' \
            --exclude='outputs/' \
            --exclude='reference/private_address_agent_pack/' \
            --exclude='node_modules/' \
            --exclude='apps/web/dist/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='.pytest_cache/' \
            --exclude='.DS_Store' \
            --exclude='._*' \
            ./ "production:${DEPLOY_PATH}/"

      - name: Migrate and start production services
        run: |
          set -euo pipefail
          ssh production "set -e; cd '${DEPLOY_PATH}'; sudo -n env API_PORT='${API_PORT}' DEPLOY_SHA='${DEPLOY_SHA}' QUOTE_RELEASE_ID='${DEPLOY_SHA}' docker compose -p '${COMPOSE_PROJECT}' --env-file '${ENV_FILE}' -f '${COMPOSE_FILE}' up -d --build api web"

      - name: Verify production health
        run: |
          set -euo pipefail
          ssh production "set -e; for attempt in \$(seq 1 24); do if curl -fsS --max-time 10 http://127.0.0.1:${API_PORT}/health; then exit 0; fi; sleep 5; done; exit 1"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 https://quote.freightclaw.net/api/health

      - name: Publish controlled quote release
        run: |
          set -euo pipefail
          rule_version_b64="$(printf '%s' "$QUOTE_RULE_VERSION" | base64 | tr -d '\n')"
          data_version_b64="$(printf '%s' "$QUOTE_DATA_VERSION" | base64 | tr -d '\n')"
          published_at_b64="$(printf '%s' "$QUOTE_PUBLISHED_AT" | base64 | tr -d '\n')"
          valid_from_b64="$(printf '%s' "$QUOTE_VALID_FROM" | base64 | tr -d '\n')"
          valid_to_b64="$(printf '%s' "$QUOTE_VALID_TO" | base64 | tr -d '\n')"
          ssh production "set -e; cd '${DEPLOY_PATH}'; rule_version=\$(printf '%s' '${rule_version_b64}' | base64 -d); data_version=\$(printf '%s' '${data_version_b64}' | base64 -d); published_at=\$(printf '%s' '${published_at_b64}' | base64 -d); valid_from=\$(printf '%s' '${valid_from_b64}' | base64 -d); valid_to=\$(printf '%s' '${valid_to_b64}' | base64 -d); service_version=\$(sudo -n env API_PORT='${API_PORT}' DEPLOY_SHA='${DEPLOY_SHA}' QUOTE_RELEASE_ID='${DEPLOY_SHA}' docker compose -p '${COMPOSE_PROJECT}' --env-file '${ENV_FILE}' -f '${COMPOSE_FILE}' exec -T api python -c 'from importlib import metadata; print(metadata.version(\"canada-final-mile-auto-quote\"))'); sudo -n env API_PORT='${API_PORT}' DEPLOY_SHA='${DEPLOY_SHA}' QUOTE_RELEASE_ID='${DEPLOY_SHA}' docker compose -p '${COMPOSE_PROJECT}' --env-file '${ENV_FILE}' -f '${COMPOSE_FILE}' exec -T api python scripts/publish_quote_release.py --release-id '${DEPLOY_SHA}' --service-version \"\$service_version\" --rule-version \"\$rule_version\" --data-version \"\$data_version\" --published-at \"\$published_at\" --valid-from \"\$valid_from\" --valid-to \"\$valid_to\" --test-data false --deployment-sha '${DEPLOY_SHA}' --deployment-ref 'refs/heads/main'"

      - name: Verify quote release readiness
        env:
          QUOTE_READINESS_API_KEY: ${{ secrets.QUOTE_READINESS_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$QUOTE_READINESS_API_KEY"
          readiness_key_b64="$(printf '%s' "$QUOTE_READINESS_API_KEY" | base64 | tr -d '\n')"
          check_readiness() {
            DEPLOY_SHA="$DEPLOY_SHA" python3 -c 'import json, os, sys; body = json.load(sys.stdin); raise SystemExit(0 if body.get("ready") is True and body.get("test_data") is False and body.get("release_id") == os.environ["DEPLOY_SHA"] and isinstance(body.get("snapshot_hash"), str) else 1)'
          }
          ssh production "readiness_key=\$(printf '%s' '${readiness_key_b64}' | base64 -d); curl --fail --silent --show-error --max-time 10 -H \"X-API-Key: \$readiness_key\" http://127.0.0.1:${API_PORT}/status" | check_readiness
          curl --fail --silent --show-error --max-time 10 -H "X-API-Key: ${QUOTE_READINESS_API_KEY}" https://quote.freightclaw.net/api/status | check_readiness

      - name: Record deployed revision
        run: |
          set -euo pipefail
          ssh production "set -e; install -d '${DEPLOY_PATH}/.deploy-state'; printf '%s\n' '${DEPLOY_SHA}' > '${DEPLOY_PATH}/.deploy-state/current-sha'; date -u '+%Y-%m-%dT%H:%M:%SZ' > '${DEPLOY_PATH}/.deploy-state/deployed-at'"
          {
            echo "## Production deployment succeeded"
            echo
            echo "- Commit: \`${DEPLOY_SHA}\`"
            echo "- URL: https://quote.freightclaw.net"
          } >> "$GITHUB_STEP_SUMMARY"

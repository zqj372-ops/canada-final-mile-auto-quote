name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: canada_quote_test
          POSTGRES_USER: quote_app
          POSTGRES_PASSWORD: quote_app_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quote_app -d canada_quote_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Verify Postgres migrations
        env:
          DATABASE_URL: postgresql+psycopg://quote_app:quote_app_test_password@localhost:5432/canada_quote_test
        run: alembic upgrade head

      - name: Run pytest
        env:
          DEV_AUTH_DISABLED: "true"
        run: pytest -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build web
        working-directory: apps/web
        run: npm run build

      - name: Audit web dependencies
        working-directory: apps/web
        run: npm audit --audit-level=moderate
        continue-on-error: true

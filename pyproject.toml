[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canada-final-mile-auto-quote"
version = "0.1.0"
description = "Deterministic Canada final-mile truck delivery quote engine with an AI explanation guardrail layer."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "pandas>=2.2,<3.0",
  "openpyxl>=3.1,<4.0",
  "python-multipart>=0.0.9,<1.0"
]

[project.optional-dependencies]
test = [
  "pytest>=8.0,<9.0"
]

[tool.setuptools.packages.find]
include = ["apps*", "packages*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]


services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-canada_quote}
      POSTGRES_USER: ${POSTGRES_USER:-quote_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quote_app_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file:
      - ../.env.example
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://quote_app:quote_app_dev_password@postgres:5432/canada_quote}
    depends_on:
      - postgres
    ports:
      - "8000:8000"

volumes:
  postgres_data:

